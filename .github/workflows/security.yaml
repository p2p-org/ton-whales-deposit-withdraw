name: Security Testing

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  sast:
    uses: p2p-org/security-workflows/.github/workflows/sast.yaml@38e27a1e796d73f6610aa324f838c5a085344890 # main
    secrets: inherit
  sca:
    uses: p2p-org/security-workflows/.github/workflows/sca.yaml@38e27a1e796d73f6610aa324f838c5a085344890 # main
    secrets: inherit
  security-quality-gate:
    uses: p2p-org/security-workflows/.github/workflows/security-quality-gate.yaml@38e27a1e796d73f6610aa324f838c5a085344890 # main
    secrets: inherit
    needs: [sast, sca]
    with:
      block: false
